name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install govulncheck
        # v1.10.0 rejects the Go 1.27 standard library with "requires go1.26 or later" type errors; v1.9.0 scans it.
        # Move to @latest once a release scans a go1.27 module cleanly.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Ensure ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: Preflight checks
        run: NO_COLOR=1 scripts/preflight-checks.sh --release

  release:
    needs: preflight
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false

      - name: Verify tag matches source version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          src=$(grep -oP '(?<=toolVersion = ")[^"]+' internal/cli/cli.go)
          if [[ "$tag" != "$src" ]]; then
            echo "tag $tag does not match toolVersion $src in internal/cli/cli.go" >&2
            echo "run scripts/bump-version.sh before tagging" >&2
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
