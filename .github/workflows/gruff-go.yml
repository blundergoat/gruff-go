name: gruff-go

on:
  pull_request:
  push:
    branches: [main]

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install govulncheck
        # v1.10.0 rejects the Go 1.27 standard library with "requires go1.26 or later" type errors; v1.9.0 scans it.
        # Move to @latest once a release scans a go1.27 module cleanly.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Ensure ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: Preflight checks
        run: NO_COLOR=1 scripts/preflight-checks.sh

      - name: Check version references
        # Fails when a source-owned version literal in docs, goldens or metadata disagrees with the version cli.go builds.
        run: bash scripts/bump-version.sh --check-references --root . --source-version "$(sed -n 's/^const toolVersion = "\(.*\)"$/\1/p' internal/cli/cli.go)"
