# gruff-go configuration generated by `gruff-go init`.
# Edit values to tighten or relax the defaults for this project.
# Run `gruff-go list-rules --format json` for the live rule catalogue.
# Fresh start for existing findings: `gruff-go analyse --generate-baseline gruff-baseline.json .`.

schemaVersion: "gruff-go.config.v0.1"

# Above either bound, retain text-level rules and omit AST-backed deep analysis.
deepScanBudget:
  enabled: true
  maxLines: 20000
  maxBytes: 2000000

# Per-command exit-code thresholds (ADR-010). Each key overrides the binary
# default for the matching gruff-go subcommand. Values: advisory | warning |
# error | none (where 'none' disables the gate, exit 0 regardless of findings).
# Precedence: CLI flag > failOn.<cmd> > binary default.
# This repository gates `summary` at advisory so scripts/preflight-checks.sh fails on findings.
failOn:
  analyse: advisory
  summary: advisory
  report: none
  dashboard: none

# The display floor: the lowest severity a report shows. It never changes an
# exit code, a score, or a baseline; failOn above is what gates a build.
minimumSeverity: advisory

# Discovery reads .gitignore first. paths.ignore is only for committed
# metadata, fixtures, or generated artifacts that should stay out of scans
# even when they are not ignored by Git.
paths:
  ignore:
    # .github is not listed: gruff-go dogfoods its own .github/workflows YAML
    # through the CI/workflow security rules. Non-workflow .github content is
    # still skipped by the built-in non-application-metadata default.
    - '.agents/**'
    - '.antigravitycli/**'
    - '.claude/**'
    - '.codex/**'
    - '.goat-flow/**'

# Project-wide allowlists.
# acceptedAbbreviations relax naming.acronym-case. Sensitive-data markers are
# unconditional and carry no payload, so nothing configures them.
allowlists:
  acceptedAbbreviations:
    - AST
    - CLI
    - HTTP
    - ID
    - JSON

# Sensitive-data exclusions. Each entry suppresses one sensitive-data rule in
# one project-relative file and requires a written reason. A symbol narrows the
# scope further. Message- and value-matching keys are rejected, and entries are
# written by hand: no reported marker or preview is ever turned into one for you.
# Every entry is counted in the report's suppressions array, zero matches included.
#
# sensitiveExclusions:
#   - rule: sensitive-data.aws-access-key
#     path: internal/rule/testdata/aws_sample.env
#     symbol: Fixtures.AWSSample
#     reason: Synthetic key used by the loader fixture; not a live credential.
sensitiveExclusions: []

# Selection narrows the active rule set. Empty lists keep the default
# selection (every rule below whose `enabled` is true).
selection:
  rules: []
  excludeRules: []
  pillars: []
  excludePillars: []

rules:
  # Flags functions outside test files whose nested control flow and boolean decisions exceed the configured cognitive complexity threshold.
  complexity.cognitive:
    enabled: true
    severity: warning
    threshold: 25

  # Flags Go functions outside test files whose branch count exceeds the default cyclomatic threshold; a switch, type switch or select counts once.
  complexity.cyclomatic:
    enabled: true
    severity: warning
    threshold: 20

  # Flags functions whose maximum control-flow nesting depth exceeds the configured threshold. Function literals reset the count.
  complexity.nesting-depth:
    enabled: true
    severity: warning
    threshold: 4

  # Flags empty control-flow blocks that usually indicate unfinished or unnecessary code.
  dead-code.empty-block:
    enabled: true
    severity: warning

  # Flags statements that appear after return, panic, break, continue, or goto in the same block.
  dead-code.unreachable-code:
    enabled: true
    severity: advisory

  # Flags package-private top-level constants whose names are not referenced anywhere else in the same parsed package. Iota groups, multi-name const specs, test files, generated files, vendor paths, and reflection-heavy packages are excluded.
  dead-code.unused-private-const:
    enabled: false
    severity: advisory

  # Flags package-private (lowercase-leading) top-level functions whose names are not referenced anywhere else in the same parsed package. Methods, init, main, and packages that import reflect are excluded so the rule stays precision-first.
  dead-code.unused-private-function:
    enabled: true
    severity: advisory

  # Flags package-private top-level types whose names are not referenced anywhere else in the same parsed package. Generated, test, vendor, and reflection-heavy packages are excluded so the parser-only candidate stays precision-first.
  dead-code.unused-private-type:
    enabled: false
    severity: advisory

  # Flags package-private top-level variables whose names are not referenced anywhere else in the same parsed package. Test files, generated files, registration tables, blank identifiers, vendor paths, and reflection-heavy packages are excluded.
  dead-code.unused-private-var:
    enabled: false
    severity: advisory

  # Flags go.mod replace directives that redirect a dependency to a local filesystem path (./…, ../…, or an absolute path). Local replacements do not reproduce for other clones or CI and usually indicate in-progress local development that should not ship.
  dependency.go-mod-local-replace:
    enabled: false
    severity: advisory

  # Flags go.mod replace directives that redirect a dependency to a different remote module path or version. Remote replacements silently swap a dependency's source and should be reviewed as a supply-chain decision.
  dependency.go-mod-remote-replace:
    enabled: true
    severity: advisory

  # Flags files that opt into stricter maintainer comments for package summaries, functions, named types, and package-scope values. With minWordsBeyondSymbol set, the rule additionally requires the comment to carry that many tokens beyond the symbol's own name (rejects name-restatement boilerplate). On _test.go files the rule does not enforce requireConstComments or requireVarComments even when ignoreTests is false; function, type, and package-summary checks still apply.
  docs.comment-rubric:
    enabled: true
    severity: warning
    threshold: 2
    options:
      ignoreTests: false
      minWordsBeyondSymbol: 3
      requireConstComments: true
      requireFunctionComments: true
      requireNamedTypeComments: true
      requirePackageSummary: true
      requireVarComments: true

  # Flags exported fields on struct types in configured includePaths that have no useful doc comment. Embedded and unexported fields are out of scope.
  docs.config-field-comment:
    enabled: true
    severity: warning

  # Flags exported top-level Go declarations (functions, methods on exported types, types, vars, consts) that have no doc comment.
  docs.exported-symbol-comment:
    enabled: true
    severity: advisory
    options:
      ignoreInternalPackages: false

  # Flags documented functions, methods, and package-level vars holding a function literal whose doc comment does not name each parameter; context, HTTP request and response, and testing handles are skipped.
  docs.missing-param-doc:
    enabled: true
    severity: advisory

  # Flags documented functions, methods, and package-level vars holding a function literal whose doc comment does not explain the returned values or, when an error is returned, when that happens; callables that return nothing are skipped.
  docs.missing-return-doc:
    enabled: true
    severity: advisory

  # Flags Go packages that do not have a package-level comment in any file.
  docs.package-comment:
    enabled: true
    severity: advisory

  # Flags nolint and nosec suppression comments that do not explain why the suppression is intentional.
  docs.suppression-without-rationale:
    enabled: true
    severity: advisory

  # Flags context.TODO calls in production files where cancellation ownership should be explicit.
  maintainability.context-todo-production:
    enabled: true
    severity: advisory

  # Flags defer statements directly inside loops, where cleanup is delayed until the enclosing function returns.
  maintainability.defer-in-loop:
    enabled: true
    severity: advisory

  # Flags error-looking values that are assigned directly to the blank identifier.
  maintainability.ignored-error:
    enabled: true
    severity: advisory

  # Flags log.Fatal and os.Exit calls outside command entrypoints and tests.
  maintainability.log-fatal-library:
    enabled: true
    severity: advisory

  # Flags storing, returning, or appending the address of a range variable copy.
  maintainability.loop-variable-address:
    enabled: true
    severity: advisory

  # Flags calls to io/ioutil APIs that have direct io or os replacements in modern Go.
  modernisation.ioutil-deprecated:
    enabled: false
    severity: advisory

  # Flags identifiers that spell configured Go initialisms with mixed casing.
  naming.acronym-case:
    enabled: false
    severity: advisory

  # Flags generic range variables and accumulator names only when surrounding context is large enough that the name loses meaning.
  naming.contextual-generic:
    enabled: true
    severity: advisory
    thresholds:
      minBodyLines: 15
      minFunctionLines: 50

  # Flags receiver accessor methods that use a Get prefix instead of a direct noun phrase.
  naming.get-prefix:
    enabled: false
    severity: advisory

  # Flags local variables and constants whose names match a list of placeholder tokens that rarely survive a careful review.
  naming.identifier-quality:
    enabled: true
    severity: advisory
    options:
      placeholderNames:
        - foo
        - bar
        - baz
        - tmp
        - temp
        - obj
        - todo
        - thing
        - stuff

  # Flags identifiers, doc comments, and struct tags containing common programming misspellings.
  naming.misspelling:
    enabled: true
    severity: advisory

  # Flags exported identifiers whose lowercase form starts with their own package name (config.ConfigOptions, rule.RuleRegistry).
  naming.package-stutter:
    enabled: false
    severity: advisory

  # Flags Go package names that use underscores instead of short lowercase words.
  naming.package-underscore:
    enabled: false
    severity: advisory

  # Flags methods on the same type that use inconsistent receiver names or pointer/value forms.
  naming.receiver-consistency:
    enabled: false
    severity: advisory

  # Flags archive extraction paths built from entry names without an obvious containment check.
  security.archive-path-traversal:
    enabled: true
    severity: advisory

  # Flags workflows that grant blanket write access with `permissions: write-all` or a bare `permissions: write`. Scoped grants such as `permissions:` with `contents: write` underneath are not flagged.
  security.github-actions-broad-permissions:
    enabled: true
    severity: advisory

  # Flags workflows triggered by pull_request_target that also check out or run code. pull_request_target runs with repository secrets in the context of a fork's pull request, so executing PR-controlled code can leak secrets. Candidate wording.
  security.github-actions-pull-request-target:
    enabled: true
    severity: advisory

  # Flags workflow run steps that download a remote script with curl/wget/Invoke-WebRequest and pipe it into a shell (for example `curl … | bash`), which executes unreviewed remote code in CI.
  security.github-actions-remote-shell:
    enabled: true
    severity: advisory

  # Flags workflows triggered by pull_request_target that reference a named secret other than the auto-provided GITHUB_TOKEN, exposing it to fork-controlled runs. A plain pull_request run from a fork receives no secrets.
  security.github-actions-secrets-in-pr:
    enabled: true
    severity: advisory

  # Flags third-party GitHub Actions referenced by a mutable branch ref (for example @main or @master), which can be repointed to new code without review. Version-shaped tags (@v4, @v4.1.0) and full 40-character commit-SHA pins pass, and first-party actions/* and github/* are exempt.
  security.github-actions-unpinned-action:
    enabled: true
    severity: advisory

  # Flags http.Client composite literals in production files that do not set Timeout.
  security.http-client-no-timeout:
    enabled: true
    severity: advisory

  # Flags production http.Server literals and ListenAndServe helpers that do not set explicit timeout controls.
  security.http-server-no-timeout:
    enabled: true
    severity: advisory

  # Flags math/rand use when the result is assigned to or returned from token, nonce, session, password, key, or other secret-looking contexts.
  security.insecure-random-secret:
    enabled: false
    severity: advisory

  # Flags request-derived values passed to http.Redirect or a Location header without a nearby allowlist or validation check (possible open redirect). Uses bounded same-function evidence and candidate wording.
  security.open-redirect-candidate:
    enabled: true
    severity: advisory

  # Flags request-derived values passed to filesystem or file-serving sinks without nearby filepath.Rel, IsLocal, basename, or containment evidence (possible path traversal). Uses bounded same-function evidence and candidate wording.
  security.path-traversal-file-access:
    enabled: true
    severity: advisory

  # Flags os file and directory calls that use world-writable or overly permissive literal modes.
  security.permissive-file-mode:
    enabled: true
    severity: advisory

  # Flags io.ReadAll-style reads of http.Request.Body in production handlers without nearby MaxBytesReader or LimitReader evidence.
  security.request-body-without-limit:
    enabled: true
    severity: advisory

  # Flags request-derived values passed as the URL of an outbound net/http request without an affirmative destination allowlist or validation check (possible SSRF). Uses bounded same-function evidence and candidate wording.
  security.request-controlled-url:
    enabled: true
    severity: advisory

  # Flags exec.Command calls that invoke a shell interpreter with command strings.
  security.shell-command:
    enabled: true
    severity: error

  # Flags text/template rendered into an HTTP response, html/template HTML/JS/URL/CSS conversions of request-derived values, and raw writes of request-derived data on an HTML content type. html/template auto-escaping and html.EscapeString are treated as safe. Candidate wording, bounded same-function evidence.
  security.template-injection-xss:
    enabled: true
    severity: advisory

  # Flags tls.Config literals that disable certificate verification or allow obsolete TLS protocol versions.
  security.tls-insecure-config:
    enabled: true
    severity: warning

  # Flags decoding of request-controlled input via encoding/gob or gopkg.in/yaml, which over-trust their payload. Decoding a concrete typed struct from a trusted local source is not flagged. Uses bounded same-function evidence and candidate wording.
  security.unsafe-deserialization:
    enabled: true
    severity: advisory

  # Flags MD5/SHA1 in security-looking contexts, direct DES/RC4 construction, and RSA key generation below 2048 bits.
  security.weak-crypto:
    enabled: true
    severity: advisory

  # Flags xml.Decoder configurations that populate a custom entity map, which re-enables entity resolution (possible XXE). The Go standard library encoding/xml does not expand external entities by default, so a plain decoder is not flagged. Candidate wording.
  security.xxe-candidate:
    enabled: true
    severity: advisory

  # Flags Anthropic API keys (sk-ant- prefix) embedded in source or text files.
  sensitive-data.anthropic-api-key:
    enabled: true
    severity: error

  # Flags AWS access key identifiers (AKIA... long-term, ASIA... session) embedded in source or text files.
  sensitive-data.aws-access-key:
    enabled: false
    severity: error

  # Flags database/queue connection URLs that embed a username and password in the URI.
  sensitive-data.connection-string:
    enabled: false
    severity: error

  # Flags files containing both a `"type": "service_account"` marker and a PEM private-key header - the documented shape of a GCP service-account JSON key file. Fires independently of sensitive-data.private-key, so a real key file produces two findings.
  sensitive-data.gcp-service-account:
    enabled: false
    severity: error

  # Flags GitHub personal-access, OAuth, user-to-server, server-to-server, and refresh tokens (gh[pousr]_ prefix) embedded in source or text files.
  sensitive-data.github-token:
    enabled: false
    severity: error

  # Flags GitLab personal, trigger, runner, and application tokens (glpat-, glptt-, glrt-, gloas-) embedded in source or text files.
  sensitive-data.gitlab-token:
    enabled: true
    severity: error

  # Flags Google API keys (AIza prefix plus 35 base64url characters) embedded in source or text files.
  sensitive-data.google-api-key:
    enabled: false
    severity: error

  # Flags JWT-shaped literals (three base64url segments separated by dots) embedded in source or text files.
  sensitive-data.jwt-token:
    enabled: true
    severity: error

  # Flags npm access tokens (npm_ and npm_pat_ prefixes) embedded in source or text files.
  sensitive-data.npm-token:
    enabled: true
    severity: error

  # Flags protected health information identifiers (US Social Security numbers, Medicare beneficiary identifiers, and label-anchored medical record numbers) embedded in source or text files. Opt-in; emits only a redacted preview.
  sensitive-data.phi-pattern:
    enabled: false
    severity: warning

  # Flags personally identifiable information (email addresses, phone numbers, and Luhn-valid payment card numbers) embedded in source or text files. Opt-in; emits only a redacted preview. Government/health identifiers are covered by sensitive-data.phi-pattern.
  sensitive-data.pii-pattern:
    enabled: false
    severity: warning

  # Flags PEM-encoded private keys embedded directly in source or text files.
  sensitive-data.private-key:
    enabled: true
    severity: error

  # Flags high-risk secret-like key/value assignments in Go and text/config files.
  sensitive-data.secret-pattern:
    enabled: true
    severity: error

  # Flags Slack bot, user, app, and refresh tokens (xox[bpar]- prefix) embedded in source or text files.
  sensitive-data.slack-token:
    enabled: true
    severity: error

  # Flags Stripe secret, publishable, and restricted live-environment keys ((sk|pk|rk)_live_ prefix) embedded in source or text files.
  sensitive-data.stripe-key:
    enabled: true
    severity: error

  # Flags Go files whose substantive line count (blank and comment-only lines are free) exceeds the threshold.
  size.file-length:
    enabled: true
    severity: error
    threshold: 1000

  # Flags Go functions that exceed the default line-count threshold.
  size.function-length:
    enabled: true
    severity: warning
    threshold: 80

  # Flags functions and methods whose parameter list exceeds the configured maximum, excluding the method receiver.
  size.parameter-count:
    enabled: true
    severity: warning
    threshold: 5

  # Groups four or more runnable tests in one file whose multi-statement bodies differ only in eligible literal values.
  test-quality.duplicate-test-body:
    enabled: false
    severity: advisory

  # Flags Go test functions with no statements or only a testing.T.Parallel() call.
  test-quality.empty-test:
    enabled: true
    severity: warning

  # Flags t.Fatal, t.Fatalf, and t.FailNow calls inside goroutines where they do not stop the parent test safely.
  test-quality.fatal-in-goroutine:
    enabled: true
    severity: advisory

  # Flags non-test helper functions that accept testing.TB, *testing.T, or *testing.B and can fail the test but never call Helper.
  test-quality.helper-missing-t-helper:
    enabled: true
    severity: advisory

  # Flags t.Parallel subtests that close over range variables without an explicit shadow copy in modules using pre-Go 1.22 loop-variable semantics.
  test-quality.parallel-range-capture:
    enabled: true
    severity: advisory

  # Flags time.Sleep calls in _test.go files. Sleeps are the dominant source of test flakiness; prefer explicit synchronisation primitives or fake clocks.
  test-quality.sleep-in-test:
    enabled: true
    severity: advisory

  # Flags Go unit-test assertions whose main evidence is a parser-visible static code-shape fact rather than runtime behaviour.
  test-quality.static-analysis-redundant-test:
    enabled: false
    severity: advisory

  # Flags os.MkdirTemp and ioutil.TempDir calls in tests when t.TempDir is available.
  test-quality.tempdir-misuse:
    enabled: true
    severity: advisory
